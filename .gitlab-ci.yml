stages:
  - mirror

# Mirror HEAD -> main + tags to GitHub
#
# Requires variables in GitLab -> Settings -> CI/CD -> Variables:
#   GITHUB_PAT         = github_pat_...    (fine-grained, Contents R/W)
#   GITHUB_MIRROR_REPO = github.com/xv1rcn/academics.git

mirror-to-github:
  stage: mirror
  image: alpine:latest
  before_script:
    - apk add --no-cache git git-lfs
  script:
    - git push "https://x-access-token:${GITHUB_PAT}@${GITHUB_MIRROR_REPO}" HEAD:main --tags
  only:
    - main
